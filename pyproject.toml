[project]
name = "cds"
version = "0.1.0"
description = "ISDA-convention single-name CDS pricer with a bootstrapped survival curve, risk report and P&L explain."
readme = "README.md"
requires-python = ">=3.11,<3.12"
dependencies = [
    "numpy==2.4.6",
    "scipy==1.17.1",
    "pandas==3.0.5",
    "matplotlib==3.11.2",
    "QuantLib==1.43",
]

[dependency-groups]
dev = [
    "pytest==9.1.1",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["cds"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
